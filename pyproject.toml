[project]
name = "supplier-risk"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faker>=40.43.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.17",
    "numpy>=2.5.4",
    "openai>=3.37.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt>=2.9",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "locust>=2.47.0",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "D", "ANN", "S", "C90"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["D101", "D103", "S101", "S105", "S106", "ANN201"]
# Writes SQL files offline from constants and the validated suppliers.yaml; no input reaches it.
"data_pipeline/zetaris_sql/generate.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["backend/app", "scripts", "data_pipeline"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
markers = [
    "integration: needs local services",
    "slow_live: integration test on a live SEC/Eurostat view (minutes until cached)",
]
addopts = "-ra --junitxml=reports/junit.xml --cov=backend/app --cov=scripts --cov=data_pipeline --cov-report=term-missing --cov-report=xml:reports/coverage.xml"
